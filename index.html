      rel="stylesheet"
    />
    <script>
      // Apply the saved (or system) theme before React renders, so the page never flashes.
      try {
        const saved = localStorage.getItem('theme')
        const dark = saved ? JSON.parse(saved) === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches
        document.documentElement.classList.toggle('dark', dark)
      } catch {
        /* storage unavailable: fall back to light */
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
